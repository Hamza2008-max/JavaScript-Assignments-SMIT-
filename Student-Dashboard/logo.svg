<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" aria-labelledby="title">
  <title id="title">Student Portal Logo</title>
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0ec1b8" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#061118" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background rounded square -->
  <rect x="0" y="0" width="160" height="160" rx="28" fill="url(#lg)"/>

  <!-- open book -->
  <g transform="translate(28,46)" filter="url(#f1)">
    <path d="M8 44c6-6 34-18 40-18s34 12 40 18v6c-8-6-34-16-40-16s-32 10-40 16v-6z" fill="#ffffff" opacity="0.08"/>
    <path d="M12 24c10 0 30-8 44-8s34 8 44 8v28c-10 0-30-8-44-8s-34 8-44 8V24z" fill="#fff"/>
    <path d="M20 28c8 0 26-6 36-6s28 6 36 6v24c-8 0-26-6-36-6s-28 6-36 6V28z" fill="#0b1220" opacity="0.06"/>
  </g>

  <!-- mortarboard (cap) simplified -->
  <g transform="translate(40,18)">
    <polygon points="40,18 0,32 40,46 80,32" fill="#061118"/>
    <rect x="36" y="42" width="8" height="18" rx="2" fill="#0ec1b8"/>
    <circle cx="40" cy="64" r="3" fill="#0ec1b8"/>
  </g>

</svg>