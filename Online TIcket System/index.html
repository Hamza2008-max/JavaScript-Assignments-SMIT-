<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ticket System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Online Ticket System</h2>

        <form id="ticketForm">

            <label>Customer Name</label>
            <input type="text" id="name" required>

            <label>Age</label>
            <input type="number" id="age" min="0" max="120" step="1" required>

            <label>Departured City</label>
            <input type="text" id="departure" required>

            <label>Arriving City</label>
            <input type="text" id="arrival" required>

            <label>Profession</label>
            <select id="profession">
                <option value="Student">Student</option>
                <option value="Employee">Employee</option>
                <option value="Business">Business</option>
                <option value="Diplomat">Diplomat</option>
                <option value="Secret Service">Secret Service</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Generate Ticket</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
