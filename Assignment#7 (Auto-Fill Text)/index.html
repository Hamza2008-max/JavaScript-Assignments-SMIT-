<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zipcode Finder</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Zipcode Finder</h2>

        <div class="input-group">
            <label for="zipcode">Zipcode</label>

            <input type="text" id="zipcode" placeholder="Enter zipcode">
        </div>


        <div class="input-group">
            <label for="city">City Name</label>

            <input type="text" id="city" placeholder="City will appear here" readonly>
        </div>


        <p class="info">
            Enter a zipcode to find the city automatically.
        </p>

    </div>


    <!-- JavaScript File -->
    <script src="index.js"></script>

</body>

</html>
