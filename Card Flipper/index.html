<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Card to WIN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Guess to WIN</h1>

        <p id="message" class="message" aria-live="polite"></p>

        <div class="cards" id="cards">
            <div class="card" data-index="0"><span class="value">?</span></div>
            <div class="card" data-index="1"><span class="value">?</span></div>
            <div class="card" data-index="2"><span class="value">?</span></div>
            <div class="card" data-index="3"><span class="value">?</span></div>
            <div class="card" data-index="4"><span class="value">?</span></div>
            <div class="card" data-index="5"><span class="value">?</span></div>
        </div>

        <div class="controls">
            <button id="resetBtn" class="btn">Reset</button>
        </div>
    </main>

    <script src="index.js" defer></script>
</body>

</html>
