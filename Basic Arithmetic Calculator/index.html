<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

    <script src="index.js"></script>

<body>

    <div class="calculator">

        <div class="display">
            <span id="output">0</span>
        </div>

        <div class="row g-2">

            <div class="col-3">
                <button class="btn btn-secondary w-100" onclick="clearDisplay()">C</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning w-100" onclick="addValue('/')">/</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning w-100" onclick="addValue('*')">×</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning w-100" onclick="addValue('-')">-</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('7')">7</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('8')">8</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('9')">9</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning w-100" onclick="addValue('+')">+</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('4')">4</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('5')">5</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('6')">6</button>
            </div>

            <div class="col-3">
                <button class="btn btn-success w-100" onclick="calculate()">=</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('1')">1</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('2')">2</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('3')">3</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light w-100" onclick="addValue('.')">.</button>
            </div>

            <div class="col-12">
                <button class="btn btn-light w-100" onclick="addValue('0')">0</button>
            </div>

        </div>

    </div>

</body>

</html>
