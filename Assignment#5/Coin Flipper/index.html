<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flipper</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <section class="card">
            <h1>Coin Toss</h1>
            <p class="subtitle">Let fate decide with a sleek digital flip.</p>

            <div class="coin-wrap">
                <div id="coin" class="coin" aria-live="polite">
                    <span class="face heads">H</span>
                    <span class="face tails">T</span>
                </div>
            </div>

            <div class="result" id="result">Tap the button to toss</div>
            <button id="tossBtn" type="button">Toss</button>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
